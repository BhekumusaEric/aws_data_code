AWSTemplateFormatVersion: '2010-09-09'
Description: 'Student Insights Pipeline - Complete AWS Infrastructure for Data Engineering Challenge 2025'

Parameters:
  ProjectName:
    Type: String
    Default: 'student-insights-pipeline'
    Description: 'Name prefix for all resources'

  Environment:
    Type: String
    Default: 'dev'
    AllowedValues: ['dev', 'staging', 'prod']
    Description: 'Environment name'

Resources:
  # S3 Buckets for data storage
  RawDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-raw-data-${Environment}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt DataProcessingLambda.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: 'raw/'

  ProcessedDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-processed-data-${Environment}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # IAM Role for Lambda Functions
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-lambda-execution-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub '${RawDataBucket}/*'
                  - !Sub '${ProcessedDataBucket}/*'
                  - !GetAtt RawDataBucket.Arn
                  - !GetAtt ProcessedDataBucket.Arn
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'

  # Data Ingestion Lambda Function
  DataIngestionLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-data-ingestion-${Environment}'
      Runtime: python3.9
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          RAW_BUCKET_NAME: !Ref RawDataBucket
          PROCESSED_BUCKET_NAME: !Ref ProcessedDataBucket
          ENVIRONMENT: !Ref Environment
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime

          def lambda_handler(event, context):
              # Placeholder - will be replaced with actual code
              return {
                  'statusCode': 200,
                  'body': json.dumps('Data ingestion function ready')
              }

  # Data Processing Lambda Function
  DataProcessingLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-data-processing-${Environment}'
      Runtime: python3.9
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 900
      MemorySize: 1024
      Environment:
        Variables:
          RAW_BUCKET_NAME: !Ref RawDataBucket
          PROCESSED_BUCKET_NAME: !Ref ProcessedDataBucket
          ENVIRONMENT: !Ref Environment
      Code:
        ZipFile: |
          import json
          import boto3
          import os

          def lambda_handler(event, context):
              # Placeholder - will be replaced with actual code
              return {
                  'statusCode': 200,
                  'body': json.dumps('Data processing function ready')
              }

  # Lambda Permission for S3 to invoke processing function
  S3InvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DataProcessingLambda
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !GetAtt RawDataBucket.Arn

  # API Gateway for data ingestion
  StudentDataAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${ProjectName}-api-${Environment}'
      Description: 'API for student data ingestion'
      EndpointConfiguration:
        Types:
          - REGIONAL

  # API Gateway Resource
  StudentDataResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref StudentDataAPI
      ParentId: !GetAtt StudentDataAPI.RootResourceId
      PathPart: 'students'

  # API Gateway Method
  StudentDataMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref StudentDataAPI
      ResourceId: !Ref StudentDataResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DataIngestionLambda.Arn}/invocations'
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json: Empty
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  # API Gateway CORS Options Method
  StudentDataOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref StudentDataAPI
      ResourceId: !Ref StudentDataResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # API Gateway Deployment
  APIDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - StudentDataMethod
      - StudentDataOptionsMethod
    Properties:
      RestApiId: !Ref StudentDataAPI
      StageName: !Ref Environment

  # Lambda Permission for API Gateway
  APIGatewayInvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DataIngestionLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub '${StudentDataAPI}/*/POST/students'

  # Athena Workgroup
  AthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub '${ProjectName}-workgroup-${Environment}'
      Description: 'Workgroup for student data analysis'
      State: ENABLED
      WorkGroupConfiguration:
        ResultConfiguration:
          OutputLocation: !Sub 's3://${ProcessedDataBucket}/athena-results/'
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetrics: true

  # Glue Database
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub '${ProjectName}_database_${Environment}'
        Description: 'Database for student insights data'

  # Glue Table for Raw Student Data
  GlueTableRawData:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: 'raw_student_data'
        Description: 'Raw student performance data'
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: 'csv'
          delimiter: ','
          skip.header.line.count: '1'
        StorageDescriptor:
          Columns:
            - Name: student_id
              Type: string
            - Name: name
              Type: string
            - Name: math_score
              Type: int
            - Name: reading_score
              Type: int
            - Name: writing_score
              Type: int
            - Name: timestamp
              Type: timestamp
            - Name: grade_level
              Type: string
            - Name: subject
              Type: string
          Location: !Sub 's3://${RawDataBucket}/raw/'
          InputFormat: 'org.apache.hadoop.mapred.TextInputFormat'
          OutputFormat: 'org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat'
          SerdeInfo:
            SerializationLibrary: 'org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe'
            Parameters:
              field.delim: ','

  # Glue Table for Processed Student Data
  GlueTableProcessedData:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: 'processed_student_data'
        Description: 'Processed and enriched student performance data'
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: 'parquet'
        PartitionKeys:
          - Name: year
            Type: string
          - Name: month
            Type: string
        StorageDescriptor:
          Columns:
            - Name: student_id
              Type: string
            - Name: name
              Type: string
            - Name: math_score
              Type: int
            - Name: reading_score
              Type: int
            - Name: writing_score
              Type: int
            - Name: average_score
              Type: double
            - Name: performance_category
              Type: string
            - Name: risk_level
              Type: string
            - Name: grade_level
              Type: string
            - Name: subject
              Type: string
            - Name: timestamp
              Type: timestamp
          Location: !Sub 's3://${ProcessedDataBucket}/processed/'
          InputFormat: 'org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat'
          OutputFormat: 'org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat'
          SerdeInfo:
            SerializationLibrary: 'org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe'

  # CloudWatch Log Groups
  DataIngestionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-data-ingestion-${Environment}'
      RetentionInDays: 14

  DataProcessingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-data-processing-${Environment}'
      RetentionInDays: 14

  # IAM Role for Athena
  AthenaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-athena-execution-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: athena.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AthenaS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:ListBucketMultipartUploads
                  - s3:ListMultipartUploadParts
                  - s3:AbortMultipartUpload
                  - s3:PutObject
                Resource:
                  - !Sub '${RawDataBucket}/*'
                  - !Sub '${ProcessedDataBucket}/*'
                  - !GetAtt RawDataBucket.Arn
                  - !GetAtt ProcessedDataBucket.Arn
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetPartition
                  - glue:GetPartitions
                  - glue:BatchCreatePartition
                  - glue:BatchDeletePartition
                  - glue:BatchUpdatePartition
                Resource: '*'

Outputs:
  RawDataBucketName:
    Description: 'Name of the S3 bucket for raw data'
    Value: !Ref RawDataBucket
    Export:
      Name: !Sub '${ProjectName}-raw-bucket-${Environment}'

  ProcessedDataBucketName:
    Description: 'Name of the S3 bucket for processed data'
    Value: !Ref ProcessedDataBucket
    Export:
      Name: !Sub '${ProjectName}-processed-bucket-${Environment}'

  APIGatewayURL:
    Description: 'URL of the API Gateway endpoint'
    Value: !Sub 'https://${StudentDataAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/students'
    Export:
      Name: !Sub '${ProjectName}-api-url-${Environment}'

  DataIngestionLambdaArn:
    Description: 'ARN of the data ingestion Lambda function'
    Value: !GetAtt DataIngestionLambda.Arn
    Export:
      Name: !Sub '${ProjectName}-ingestion-lambda-arn-${Environment}'

  DataProcessingLambdaArn:
    Description: 'ARN of the data processing Lambda function'
    Value: !GetAtt DataProcessingLambda.Arn
    Export:
      Name: !Sub '${ProjectName}-processing-lambda-arn-${Environment}'

  GlueDatabaseName:
    Description: 'Name of the Glue database'
    Value: !Ref GlueDatabase
    Export:
      Name: !Sub '${ProjectName}-glue-database-${Environment}'

  AthenaWorkgroupName:
    Description: 'Name of the Athena workgroup'
    Value: !Ref AthenaWorkgroup
    Export:
      Name: !Sub '${ProjectName}-athena-workgroup-${Environment}'